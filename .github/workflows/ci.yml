name: Controllo Progetto (CI)

on:
  push:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Prova a costruire l'immagine Docker
        run: docker build -t test-image .