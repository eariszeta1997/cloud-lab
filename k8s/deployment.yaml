apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-lab
  template:
    metadata:
      labels:
        app: cloud-lab
    spec:
      containers:
      - name: web
        image: cloud-lab:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80